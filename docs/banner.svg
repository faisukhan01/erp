<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Buildora — describe it, watch it ship.">
  <!-- OBSIDIAN — realistic black canvas, one cyan signal, zero gradients -->
  <defs>
    <clipPath id="frame">
      <rect width="1280" height="640" rx="0"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- canvas -->
    <rect width="1280" height="640" fill="#050505"/>

    <!-- hairline engineering grid -->
    <g stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1">
      <path d="M 80 0 V 640"/><path d="M 160 0 V 640"/><path d="M 240 0 V 640"/>
      <path d="M 320 0 V 640"/><path d="M 400 0 V 640"/><path d="M 480 0 V 640"/>
      <path d="M 560 0 V 640"/><path d="M 640 0 V 640"/><path d="M 720 0 V 640"/>
      <path d="M 800 0 V 640"/><path d="M 880 0 V 640"/><path d="M 960 0 V 640"/>
      <path d="M 1040 0 V 640"/><path d="M 1120 0 V 640"/><path d="M 1200 0 V 640"/>
      <path d="M 0 80 H 1280"/><path d="M 0 160 H 1280"/><path d="M 0 240 H 1280"/>
      <path d="M 0 320 H 1280"/><path d="M 0 400 H 1280"/><path d="M 0 480 H 1280"/>
      <path d="M 0 560 H 1280"/>
    </g>

    <!-- top + bottom hairlines -->
    <rect x="0" y="0" width="1280" height="1" fill="#FFFFFF" fill-opacity="0.12"/>
    <rect x="0" y="639" width="1280" height="1" fill="#FFFFFF" fill-opacity="0.12"/>

    <!-- mono kicker -->
    <text x="640" y="196" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,monospace" font-size="15" letter-spacing="6" fill="#A1A1AA">POWERED BY Z.AI</text>
    <circle cx="523" cy="191" r="3" fill="#22D3EE"/>

    <!-- wordmark -->
    <g>
      <rect x="440" y="248" width="64" height="64" rx="14" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.5"/>
      <rect x="462" y="270" width="20" height="20" rx="4" fill="#22D3EE"/>
      <text x="528" y="302" font-family="'Bricolage Grotesque','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="76" font-weight="800" letter-spacing="-2" fill="#FAFAFA">buildora</text>
    </g>

    <!-- tagline -->
    <text x="640" y="396" text-anchor="middle" font-family="'Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="30" font-weight="500" fill="#FAFAFA">Describe it. Watch it ship<tspan fill="#22D3EE">.</tspan></text>

    <!-- sub -->
    <text x="640" y="440" text-anchor="middle" font-family="'Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" fill="#71717A">One sentence in — a working web app out. Blueprint, live code streaming, versions.</text>

    <!-- stack chips row -->
    <g font-family="'JetBrains Mono','SF Mono',Menlo,monospace" font-size="12" letter-spacing="2">
      <rect x="352" y="492" width="104" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.02" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="404" y="513" text-anchor="middle" fill="#A1A1AA">NEXT.JS</text>

      <rect x="472" y="492" width="104" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.02" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="524" y="513" text-anchor="middle" fill="#A1A1AA">FASTAPI</text>

      <rect x="592" y="492" width="128" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.02" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="656" y="513" text-anchor="middle" fill="#A1A1AA">POSTGRESQL</text>

      <rect x="736" y="492" width="72" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.02" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="772" y="513" text-anchor="middle" fill="#A1A1AA">Z.AI</text>

      <rect x="824" y="492" width="104" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.02" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="876" y="513" text-anchor="middle" fill="#A1A1AA">SSE</text>
    </g>

    <!-- corner meta -->
    <text x="40" y="604" font-family="'JetBrains Mono','SF Mono',Menlo,monospace" font-size="11" letter-spacing="3" fill="#52525B">BUILDORA — AI APP BUILDER</text>
    <circle cx="1218" cy="600" r="3" fill="#22D3EE"/>
    <text x="1240" y="604" text-anchor="end" font-family="'JetBrains Mono','SF Mono',Menlo,monospace" font-size="11" letter-spacing="3" fill="#52525B" dx="-14">V2.0</text>
  </g>
</svg>
