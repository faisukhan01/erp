<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ONYX — The AI-native IDE">
  <!-- flat black canvas — no gradients, ever -->
  <rect width="1200" height="360" fill="#030303"/>
  <rect x="0.5" y="0.5" width="1199" height="359" stroke="#141414"/>

  <!-- faint hairline grid, machined not decorated -->
  <g stroke="#0c0c0c" stroke-width="1">
    <path d="M0 90h1200M0 180h1200M0 270h1200"/>
    <path d="M150 0v360M300 0v360M450 0v360M600 0v360M750 0v360M900 0v360M1050 0v360"/>
  </g>

  <!-- the mark: diamond, one cyan facet -->
  <g transform="translate(90 108)">
    <path d="M72 0 144 72 72 144 0 72 72 0Z" stroke="#3a3a3a" stroke-width="2.5" fill="none"/>
    <path d="M0 72h144" stroke="#3a3a3a" stroke-width="1.6"/>
    <path d="M72 0 36 72l36 72" stroke="#262626" stroke-width="1.6"/>
    <path d="M72 0l36 72-36 72L72 0Z" fill="#00e5ff"/>
    <path d="M72 0l36 72-36 72" stroke="#8df3ff" stroke-width="1.4"/>
  </g>

  <!-- wordmark -->
  <text x="270" y="168" font-family="'Unbounded','Space Grotesk',Arial,sans-serif" font-size="64" font-weight="600" letter-spacing="20" fill="#f2f2f2">ONYX</text>
  <rect x="560" y="150" width="12" height="12" fill="#00e5ff"/>

  <text x="272" y="206" font-family="'JetBrains Mono',Menlo,monospace" font-size="17" letter-spacing="6" fill="#8a8a8a">THE AI-NATIVE IDE</text>

  <!-- feature ticks -->
  <g font-family="'JetBrains Mono',Menlo,monospace" font-size="14" letter-spacing="1.5" fill="#5c5c5c">
    <text x="272" y="252">monaco editor</text>
    <text x="272" y="278">real terminal</text>
    <text x="452" y="252">git bridge</text>
    <text x="452" y="278">z.ai pair programming</text>
  </g>
  <g stroke="#00e5ff" stroke-width="2" stroke-linecap="square">
    <path d="M256 246l4 4 7-8"/>
    <path d="M256 272l4 4 7-8"/>
    <path d="M436 246l4 4 7-8"/>
    <path d="M436 272l4 4 7-8"/>
  </g>

  <!-- status line, bottom -->
  <g font-family="'JetBrains Mono',Menlo,monospace" font-size="12" letter-spacing="3" fill="#333333">
    <text x="272" y="322">BLACK OWNERS THE SCREEN</text>
  </g>
  <circle cx="1058" cy="318" r="4" fill="#00e5ff"/>
  <text x="1072" y="323" font-family="'JetBrains Mono',Menlo,monospace" font-size="12" letter-spacing="2" fill="#00e5ff">LINK</text>
</svg>
