<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Buildora — describe it, watch it ship">
  <defs>
    <!-- gold shimmer sweep for the tagline -->
    <linearGradient id="shimmerGold" x1="0" y1="0" x2="320" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="0.45" stop-color="#fbbf24"/>
      <stop offset="0.55" stop-color="#fffbeb"/>
      <stop offset="0.65" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-320 0; 700 0; -320 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="faceTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="faceLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="faceRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="heroGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgFade" cx="0.5" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#101014"/>
      <stop offset="1" stop-color="#030303"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 56" fill="none" stroke="#ffffff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <linearGradient id="fadeMask" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <mask id="gridMask">
      <rect x="0" y="0" width="1200" height="340" fill="url(#fadeMask)" opacity="0.5"/>
    </mask>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="338" rx="24"/></clipPath>
    <clipPath id="editorClip"><rect x="742" y="64" width="392" height="216" rx="14"/></clipPath>
  </defs>

  <!-- frame + background -->
  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="#030303"/>
    <rect width="1200" height="340" fill="url(#bgFade)"/>
    <rect width="1200" height="340" fill="url(#grid)" mask="url(#gridMask)" opacity="0.8"/>

    <!-- ambient glows -->
    <circle cx="205" cy="150" r="230" fill="url(#heroGlow)">
      <animate attributeName="r" values="230;260;230" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="938" cy="120" r="190" fill="url(#heroGlow)" opacity="0.5">
      <animate attributeName="opacity" values="0.35;0.6;0.35" dur="11s" repeatCount="indefinite"/>
    </circle>

    <!-- ============================== logo mark ============================== -->
    <g transform="translate(96 84)">
      <!-- rotating dashed ring -->
      <g>
        <circle cx="86" cy="86" r="72" fill="none" stroke="#fbbf24" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="10 12" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="rotate" from="0 86 86" to="360 86 86" dur="26s" repeatCount="indefinite"/>
      </g>
      <!-- orbiting spark -->
      <g>
        <circle cx="86" cy="14" r="4" fill="#fbbf24">
          <animate attributeName="opacity" values="1;0.55;1" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="86" cy="14" r="9" fill="#fbbf24" opacity="0.18"/>
        <animateTransform attributeName="transform" type="rotate" from="0 86 86" to="360 86 86" dur="7s" repeatCount="indefinite"/>
      </g>
      <!-- logo tile -->
      <rect x="42" y="42" width="88" height="88" rx="22" fill="#fbbf24" fill-opacity="0.09" stroke="#fbbf24" stroke-opacity="0.45" stroke-width="1.5"/>
      <!-- isometric cube stack -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="5s" repeatCount="indefinite"/>
        <polygon points="86,40 112,54 86,68 60,54" fill="url(#faceTop)"/>
        <polygon points="60,54 86,68 86,98 60,84" fill="url(#faceLeft)"/>
        <polygon points="112,54 86,68 86,98 112,84" fill="url(#faceRight)"/>
      </g>
      <g opacity="0.92">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="5s" begin="0.6s" repeatCount="indefinite"/>
        <polygon points="86,74 104,83.5 86,93 68,83.5" fill="url(#faceTop)" opacity="0.95"/>
        <polygon points="68,83.5 86,93 86,112 68,102.5" fill="url(#faceLeft)"/>
        <polygon points="104,83.5 86,93 86,112 104,102.5" fill="url(#faceRight)"/>
      </g>
      <!-- tile glow pulse -->
      <rect x="42" y="42" width="88" height="88" rx="22" fill="#fbbf24" opacity="0.0">
        <animate attributeName="opacity" values="0;0.10;0" dur="4.5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- ============================== wordmark ============================== -->
    <text x="268" y="136" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="64" font-weight="700" letter-spacing="-2" fill="#fafafa">Buildora</text>
    <rect x="270" y="152" width="118" height="3" rx="1.5" fill="#fbbf24" opacity="0.85"/>
    <text x="268" y="196" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="27" font-weight="600" fill="url(#shimmerGold)">Describe it. Watch it ship.</text>
    <text x="270" y="228" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="14.5" fill="#8f8f99">One sentence becomes a stunning, working web app —</text>
    <text x="270" y="250" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="14.5" fill="#8f8f99">then refines it through conversation.</text>

    <!-- pipeline chips -->
    <g font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11.5" letter-spacing="2">
      <g>
        <rect x="270" y="266" width="86" height="24" rx="12" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.35"/>
        <text x="313" y="282" text-anchor="middle" fill="#fcd34d">BLUEPRINT</text>
      </g>
      <text x="368" y="282" fill="#fbbf24" opacity="0.7">▸</text>
      <g>
        <rect x="382" y="266" width="70" height="24" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.14"/>
        <text x="417" y="282" text-anchor="middle" fill="#a1a1aa">STREAM</text>
      </g>
      <text x="464" y="282" fill="#fbbf24" opacity="0.7">▸</text>
      <g>
        <rect x="478" y="266" width="68" height="24" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.14"/>
        <text x="512" y="282" text-anchor="middle" fill="#a1a1aa">REFINE</text>
      </g>
      <text x="558" y="282" fill="#fbbf24" opacity="0.7">▸</text>
      <g>
        <rect x="572" y="266" width="58" height="24" rx="12" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-opacity="0.35"/>
        <text x="601" y="282" text-anchor="middle" fill="#6ee7b7">SHIP</text>
      </g>
    </g>

    <!-- ============================== editor mock ============================== -->
    <g>
      <rect x="742" y="64" width="392" height="216" rx="14" fill="#0a0a0c" stroke="#ffffff" stroke-opacity="0.1"/>
      <rect x="742" y="64" width="392" height="34" rx="14" fill="#ffffff" fill-opacity="0.025"/>
      <line x1="742" y1="98" x2="1134" y2="98" stroke="#ffffff" stroke-opacity="0.07"/>
      <circle cx="762" cy="81" r="4.5" fill="#3f3f46"/>
      <circle cx="778" cy="81" r="4.5" fill="#3f3f46"/>
      <circle cx="794" cy="81" r="4.5" fill="#fbbf24" fill-opacity="0.65">
        <animate attributeName="fill-opacity" values="0.65;0.25;0.65" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <text x="812" y="85.5" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12" fill="#71717a">index.html</text>
      <text x="1118" y="85.5" text-anchor="end" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11" fill="#52525b">streaming…</text>

      <g clip-path="url(#editorClip)">
        <!-- code lines -->
        <g>
          <rect x="762" y="114" width="180" height="7" rx="3.5" fill="#ffffff" opacity="0.10"/>
          <rect x="762" y="130" width="284" height="7" rx="3.5" fill="#ffffff" opacity="0.07"/>
          <rect x="774" y="146" width="212" height="7" rx="3.5" fill="#fbbf24" opacity="0.30"/>
          <rect x="774" y="162" width="150" height="7" rx="3.5" fill="#ffffff" opacity="0.09"/>
          <rect x="786" y="178" width="240" height="7" rx="3.5" fill="#34d399" opacity="0.22"/>
          <rect x="786" y="194" width="120" height="7" rx="3.5" fill="#ffffff" opacity="0.07"/>
          <rect x="774" y="210" width="196" height="7" rx="3.5" fill="#ffffff" opacity="0.09"/>
          <rect x="762" y="226" width="90" height="7" rx="3.5" fill="#ffffff" opacity="0.06"/>
        </g>
        <!-- streaming caret line -->
        <g>
          <rect x="762" y="242" width="96" height="7" rx="3.5" fill="#fbbf24" opacity="0.8">
            <animate attributeName="width" values="10;132;10" dur="2.8s" repeatCount="indefinite"/>
          </rect>
          <rect x="864" y="242" width="2.5" height="9" fill="#fffbeb">
            <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
            <animate attributeName="x" values="864;990;864" dur="2.8s" repeatCount="indefinite"/>
          </rect>
        </g>
        <!-- scan sweep -->
        <rect x="742" y="60" width="392" height="40" fill="url(#heroGlow)" opacity="0.5">
          <animate attributeName="y" values="60;240;60" dur="5s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- live chip -->
      <g transform="translate(742 296)">
        <rect width="212" height="30" rx="15" fill="#34d399" fill-opacity="0.07" stroke="#34d399" stroke-opacity="0.3"/>
        <circle cx="18" cy="15" r="4" fill="#34d399">
          <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
        </circle>
        <text x="30" y="19.5" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12" fill="#6ee7b7">v1 is live · 14,860 chars</text>
      </g>
      <g transform="translate(966 296)">
        <rect width="168" height="30" rx="15" fill="#fbbf24" fill-opacity="0.06" stroke="#fbbf24" stroke-opacity="0.28"/>
        <text x="84" y="19.5" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12" fill="#fcd34d">streamed in 38s</text>
      </g>
    </g>

    <!-- footer meta -->
    <text x="270" y="316" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11" letter-spacing="1.5" fill="#52525b">POWERED BY Z.AI · NEXT.JS 16 · FASTAPI · NEON POSTGRESQL</text>
  </g>

  <!-- border -->
  <rect x="1" y="1" width="1198" height="338" rx="24" stroke="url(#goldEdge)" stroke-width="1.5"/>
</svg>
