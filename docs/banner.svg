<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Buildora — describe it, watch it ship">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0a0b"/>
      <stop offset="0.5" stop-color="#100e08"/>
      <stop offset="1" stop-color="#0a0a0b"/>
    </linearGradient>
    <radialGradient id="glowTop" cx="0.5" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.14"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fcd34d">
        <animate attributeName="stop-color" values="#fcd34d;#fffbeb;#fbbf24;#fcd34d" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#f59e0b">
        <animate attributeName="stop-color" values="#f59e0b;#fcd34d;#fffbeb;#f59e0b" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4d4d8">
        <animate attributeName="stop-color" values="#d4d4d8;#fde68a;#d4d4d8" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#fde68a">
        <animate attributeName="stop-color" values="#fde68a;#fcd34d;#fde68a" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#d4d4d8">
        <animate attributeName="stop-color" values="#d4d4d8;#fde68a;#d4d4d8" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="cubeL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#b45309" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="cubeR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="cubeT" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fef3c7" stop-opacity="1"/>
      <stop offset="1" stop-color="#fcd34d" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="cubeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="codeClip">
      <rect x="0" y="0" width="276" height="86" rx="10"/>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glowTop)"/>
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 40H1200M0 80H1200M0 120H1200M0 160H1200M0 200H1200M0 240H1200M0 280H1200"/>
    <path d="M40 0V320M80 0V320M120 0V320M160 0V320M200 0V320M240 0V320M280 0V320M320 0V320M360 0V320M400 0V320M440 0V320M480 0V320M520 0V320M560 0V320M600 0V320M640 0V320M680 0V320M720 0V320M760 0V320M800 0V320M840 0V320M880 0V320M920 0V320M960 0V320M1000 0V320M1040 0V320M1080 0V320M1120 0V320M1160 0V320"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="16" stroke="#fbbf24" stroke-opacity="0.22"/>

  <!-- ======================= isometric cube ======================= -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -9; 0 0" dur="4.5s" repeatCount="indefinite" additive="sum"/>
    <ellipse cx="165" cy="248" rx="86" ry="16" fill="#000000" opacity="0.45"/>
    <circle cx="165" cy="170" r="105" fill="url(#cubeGlow)"/>
    <g>
      <!-- top face -->
      <path d="M165 96 L247 142 L165 188 L83 142 Z" fill="url(#cubeT)"/>
      <!-- left face -->
      <path d="M83 142 L165 188 L165 254 L83 208 Z" fill="url(#cubeL)"/>
      <!-- right face -->
      <path d="M247 142 L165 188 L165 254 L247 208 Z" fill="url(#cubeR)"/>
      <!-- inner grid lines for "builder blocks" feel -->
      <path d="M124 165 L206 119" stroke="#0a0a0b" stroke-opacity="0.28" stroke-width="2"/>
      <path d="M124 221 L124 165" stroke="#0a0a0b" stroke-opacity="0.25" stroke-width="2"/>
      <path d="M206 175 L206 119" stroke="#0a0a0b" stroke-opacity="0.22" stroke-width="2"/>
      <!-- small floating companion cube -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 0" dur="3.2s" repeatCount="indefinite"/>
        <path d="M262 78 L292 95 L262 112 L232 95 Z" fill="url(#cubeT)"/>
        <path d="M232 95 L262 112 L262 138 L232 121 Z" fill="url(#cubeL)"/>
        <path d="M292 95 L262 112 L262 138 L292 121 Z" fill="url(#cubeR)"/>
      </g>
    </g>
  </g>

  <!-- ======================= wordmark block ======================= -->
  <g>
    <!-- pill -->
    <rect x="330" y="52" width="196" height="34" rx="17" fill="#fbbf24" fill-opacity="0.10" stroke="#fbbf24" stroke-opacity="0.35"/>
    <circle cx="352" cy="69" r="4" fill="#34d399">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="366" y="74" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fde68a" letter-spacing="1.5">POWERED BY Z.AI</text>

    <!-- title -->
    <text x="326" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="url(#brand)" letter-spacing="-2">Buildora</text>

    <!-- tagline -->
    <text x="330" y="198" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="url(#shimmer)">Describe it. Watch it ship.</text>

    <!-- pipeline chips -->
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
      <rect x="330" y="224" width="118" height="32" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="347" y="245" fill="#a1a1aa">Blueprint</text>
      <path d="M456 240 l8 0 m-3 -3 l3 3 l-3 3" stroke="#fbbf24" stroke-width="2" fill="none" stroke-linecap="round"/>
      <rect x="474" y="224" width="118" height="32" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="495" y="245" fill="#a1a1aa">Stream</text>
      <path d="M600 240 l8 0 m-3 -3 l3 3 l-3 3" stroke="#fbbf24" stroke-width="2" fill="none" stroke-linecap="round"/>
      <rect x="618" y="224" width="118" height="32" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="637" y="245" fill="#a1a1aa">Refine</text>
      <path d="M744 240 l8 0 m-3 -3 l3 3 l-3 3" stroke="#fbbf24" stroke-width="2" fill="none" stroke-linecap="round"/>
      <rect x="762" y="224" width="96" height="32" rx="16" fill="#fbbf24" fill-opacity="0.14" stroke="#fbbf24" stroke-opacity="0.4"/>
      <text x="786" y="245" fill="#fde68a">Ship</text>
    </g>

    <!-- tech line -->
    <text x="330" y="292" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#71717a">Z.AI brain&#160;&#160;&#183;&#160;&#160;FastAPI engine&#160;&#160;&#183;&#160;&#160;Neon PostgreSQL memory&#160;&#160;&#183;&#160;&#160;Next.js 16</text>
  </g>

  <!-- ======================= mini code editor ======================= -->
  <g transform="translate(888 78)">
    <rect width="276" height="164" rx="12" fill="#101010" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect width="276" height="30" rx="12" fill="#ffffff" fill-opacity="0.04"/>
    <circle cx="18" cy="15" r="4" fill="#f43f5e" fill-opacity="0.85"/>
    <circle cx="32" cy="15" r="4" fill="#fbbf24" fill-opacity="0.85"/>
    <circle cx="46" cy="15" r="4" fill="#34d399" fill-opacity="0.85"/>
    <text x="66" y="19" font-family="SF Mono, Consolas, monospace" font-size="11" fill="#71717a">index.html</text>
    <g clip-path="url(#codeClip)" transform="translate(12 38)" font-family="SF Mono, Consolas, monospace" font-size="11">
      <text x="0" y="10" fill="#fbbf24">&lt;!DOCTYPE</text>
      <text x="72" y="10" fill="#a1a1aa">html&gt;</text>
      <text x="0" y="26" fill="#a1a1aa">&lt;</text>
      <text x="6" y="26" fill="#fde68a">body</text>
      <text x="34" y="26" fill="#a1a1aa">&gt;</text>
      <text x="0" y="42" fill="#d4d4d8">&#160;&#160;&lt;h1&gt;</text>
      <text x="40" y="42" fill="#34d399">Hello, Buildora</text>
      <text x="132" y="42" fill="#d4d4d8">&lt;/h1&gt;</text>
      <text x="0" y="58" fill="#d4d4d8">&#160;&#160;&lt;script&gt;</text>
      <text x="0" y="74" fill="#71717a">&#160;&#160;&#160;&#160;build(</text>
      <text x="52" y="74" fill="#fde68a">"your idea"</text>
      <text x="122" y="74" fill="#71717a">)</text>
    </g>
    <!-- streaming line -->
    <rect x="14" y="122" width="248" height="4" rx="2" fill="#ffffff" fill-opacity="0.07"/>
    <rect x="14" y="122" width="90" height="4" rx="2" fill="url(#stream)">
      <animate attributeName="x" values="14;172;14" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600">
      <circle cx="22" cy="143" r="4" fill="#34d399">
        <animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="32" y="147" fill="#34d399">v1 is live</text>
      <text x="96" y="147" fill="#52525b">&#183; 14,860 chars &#183; streamed in 38s</text>
    </g>
  </g>
</svg>
